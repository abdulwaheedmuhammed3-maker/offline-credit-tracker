<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KioskLedger - Offline Micro-Credit Prototype</title>
    <style>
        :root { --primary: #10b981; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 1.25rem; margin-top: 0; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.2); color: var(--primary); padding: 4px 8px; border-radius: 999px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; color: var(--text); border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        button:hover { opacity: 0.9; }
        .ledger-list { margin-top: 24px; border-top: 1px solid #334155; padding-top: 16px; max-height: 200px; overflow-y: auto; }
        .ledger-item { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 8px 0; border-bottom: 1px solid #334155; }
        .ledger-item span:last-child { font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>KioskLedger <span class="badge">Offline v1.0</span></h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Target User: Market Trader / POS Agent in Ilorin</p>
        
        <div class="form-group">
            <label for="customerName">Customer / Trader Name</label>
            <input type="text" id="customerName" placeholder="e.g., Mama Rukayat (Ipata Market)">
        </div>
        
        <div class="form-group">
            <label for="amount">Credit / Float Amount (₦)</label>
            <input type="number" id="amount" placeholder="e.g., 5000">
        </div>

        <button onclick="recordTransaction()">Commit Local Ledger Entry</button>

        <div class="ledger-list" id="ledgerList">
            <div style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">No local sync logs yet.</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTransactions);

        function recordTransaction() {
            const name = document.getElementById('customerName').value.trim();
            const amount = document.getElementById('amount').value.trim();
            
            if (!name || !amount) {
                alert('Please enter both name and amount.');
                return;
            }

            const tx = {
                name: name,
                amount: Number(amount).toLocaleString(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let transactions = JSON.parse(localStorage.getItem('kiosk_ledger') || '[]');
            transactions.unshift(tx);
            localStorage.setItem('kiosk_ledger', JSON.stringify(transactions));

            document.getElementById('customerName').value = '';
            document.getElementById('amount').value = '';
            loadTransactions();
        }

        function loadTransactions() {
            const list = document.getElementById('ledgerList');
            let transactions = JSON.parse(localStorage.getItem('kiosk_ledger') || '[]');
            
            if (transactions.length === 0) {
                list.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">No local sync logs yet.</div>';
                return;
            }

            list.innerHTML = transactions.map(t => `
                <div class="ledger-item">
                    <span>${t.name} <small style="color:var(--text-muted)">(${t.time})</small></span>
                    <span>₦${t.amount}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
